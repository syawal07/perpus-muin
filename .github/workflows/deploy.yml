name: Deploy Perpus App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install

    - name: Generate Frontend .env File
      run: |
        cd frontend
        echo "PORT=4002" > .env
        echo "NEXT_PUBLIC_API_URL=https://adminperpus.muallimin.sch.id/api" >> .env
        echo "NEXT_PUBLIC_STORAGE_URL=https://adminperpus.muallimin.sch.id/storage" >> .env

    - name: Build Next.js Application
      run: |
        cd frontend
        npm run build

    - name: Transfer Frontend Files to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        source: "frontend/.next,frontend/public,frontend/package.json,frontend/next.config.mjs,frontend/.env"
        target: "/home/muallimi/domains/perpustakaan.muallimin.sch.id/public_html/"
        strip_components: 1 
        overwrite: true

    - name: Execute Server Updates & Restart PM2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        script: |
          echo "🚀 Mulai update Frontend..."
          cd /home/muallimi/domains/perpustakaan.muallimin.sch.id/public_html/
          
          npm cache clean --force
          npm install --production --no-audit --no-fund
          
          # Buat ekosistem PM2 mutlak khusus Perpus
          cat << 'EOF' > ecosystem.config.js
          module.exports = {
            apps: [{
              name: "perpus-fe",
              script: ".next/standalone/server.js",
              env: {
                PORT: 4002,
                HOSTNAME: "127.0.0.1",
                NEXT_PUBLIC_API_URL: "https://adminperpus.muallimin.sch.id/api",
                NEXT_PUBLIC_STORAGE_URL: "https://adminperpus.muallimin.sch.id/storage"
              }
            }]
          }
          EOF
          
          # Hapus mesin lama dan nyalakan ulang dengan konfigurasi baru
          pm2 delete perpus-fe || true
          pm2 start ecosystem.config.js
          pm2 save
          
          echo "⚙️ Mulai update Backend (Admin Perpus)..."
          cd /home/muallimi/perpus-app/
          git pull origin main
          cd backend
          
          /usr/local/php82/bin/php /usr/local/bin/composer install --optimize-autoloader --no-dev
          /usr/local/php82/bin/php artisan migrate --force
          /usr/local/php82/bin/php artisan optimize:clear
          
          echo "✅ Semua update Perpus selesai!"