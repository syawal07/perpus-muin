name: Deploy Perpus App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install

    - name: Generate Frontend Environment
      run: |
        cd frontend
        echo "PORT=4002" > .env.production
        echo "NEXT_PUBLIC_API_URL=https://adminperpus.muallimin.sch.id" >> .env.production
        echo "NEXT_PUBLIC_STORAGE_URL=https://adminperpus.muallimin.sch.id/storage" >> .env.production

    - name: Build Next.js Application and Bundle Standalone
      run: |
        cd frontend
        npm run build
        
        mkdir deploy_build
        cp -r .next/standalone/. deploy_build/
        cp -r public deploy_build/public
        mkdir -p deploy_build/.next
        cp -r .next/static deploy_build/.next/static
        cp .env.production deploy_build/
        
        cat << 'EOF' > deploy_build/ecosystem.config.js
        module.exports = {
          apps: [{
            name: "perpus-fe",
            script: "server.js",
            env: {
              PORT: 4002,
              HOSTNAME: "127.0.0.1",
              NEXT_PUBLIC_API_URL: "https://adminperpus.muallimin.sch.id",
              NEXT_PUBLIC_STORAGE_URL: "https://adminperpus.muallimin.sch.id/storage"
            }
          }]
        }
        EOF

    - name: Transfer Artifact to VPS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        source: "frontend/deploy_build"
        target: "/home/muallimi/domains/perpustakaan.muallimin.sch.id/public_html/"
        strip_components: 2 
        overwrite: true

    - name: Execute Server Updates and PM2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        script: |
          echo "Mulai Eksekusi Frontend di Server..."
          cd /home/muallimi/domains/perpustakaan.muallimin.sch.id/public_html/
          
          pm2 start ecosystem.config.js || pm2 reload perpus-fe
          pm2 save
          
          echo "Mulai update Backend Admin Perpus..."
          cd /home/muallimi/perpus-muin/
          git pull origin main
          
          cd backend
          /usr/local/php82/bin/php /usr/local/bin/composer install --optimize-autoloader --no-dev
          /usr/local/php82/bin/php artisan migrate --force
          /usr/local/php82/bin/php artisan optimize:clear
          /usr/local/php82/bin/php artisan optimize
          
          echo "Semua update CI/CD Perpus selesai."