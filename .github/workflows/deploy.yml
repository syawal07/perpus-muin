name: Deploy Perpus App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install

    - name: Generate Frontend .env File
      run: |
        cd frontend
        echo "PORT=4002" > .env
        echo "NEXT_PUBLIC_API_URL=https://adminperpus.muallimin.sch.id/api" >> .env
        echo "NEXT_PUBLIC_STORAGE_URL=https://adminperpus.muallimin.sch.id/storage" >> .env

    - name: Build Next.js Application
      run: |
        cd frontend
        npm run build

    - name: Transfer Frontend Files to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        source: "frontend/.next,frontend/public,frontend/package.json,frontend/next.config.mjs"
        target: "/home/muallimi/domains/perpustakaan.muallimin.sch.id/public_html/"
        strip_components: 1 
        overwrite: true

    - name: Execute Server Updates (Frontend & Backend)
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        script: |
          echo "🚀 Mulai update Frontend..."
          cd /home/muallimi/domains/perpustakaan.muallimin.sch.id/public_html/
          
          # Bersihkan sisa cache memori NPM sebelumnya
          npm cache clean --force
          
          # Instalasi mode sangat ringan (tanpa audit dan tanpa dev-dependencies)
          npm install --omit=dev --no-audit --no-fund
          
          pm2 restart perpus-fe
          pm2 save
          
          echo "⚙️ Mulai update Backend (Admin Perpus)..."
          cd /home/muallimi/perpus-app/
          git pull origin main
          cd backend
          composer install --optimize-autoloader --no-dev
          php artisan migrate --force
          php artisan optimize:clear
          
          echo "✅ Semua update Perpus selesai!"